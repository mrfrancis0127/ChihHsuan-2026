# 八大政見清單（政見文件目錄頁使用）
# - title：卡片標題；hook：選民的問題；points：條列重點（與精簡版政見一致）
# - 對應的政見文件（_policies/0X-xxx.md）上線後，卡片會自動出現「查看詳細內容」按鈕
- order: 1
  area: 宜居
  title: 居住正義｜回歸居住本質，落實青年安居
  hook: 小孩要成家了，卻買不起厝？
  points:
    - 設「彰化縣住宅及都市更新中心」，盤點和線伸公有地，推動平價彰化青年住宅
    - 比照桃園提供民間建案容積獎勵，換取可負擔社宅（市價 5～7 折）
    - 落實囤房稅，防止空地養地、惡意炒房
    - 公有地只租不售，禁止標售變賣
    - 推動危老與老屋都更，原住戶享優先換購或承租在地社宅權益
- order: 2
  area: 宜業
  title: 產業復興｜青年創業、傳產升級與智慧科技
  hook: 畢業就要離鄉背井找工作？
  points:
    - 爭取和線伸青年創業基地，低利貸款＋一站式輔導
    - 爭取縣府補助傳產「智慧・精緻・品牌・客製」四化升級，爭取工研院輔導
    - 爭取無人載具測試場，切入半導體耗材供應鏈
    - 推廣沿海耐鹽作物、溫室農業、高值生技養殖
- order: 3
  area: 宜居
  title: 交通安全｜人本交通與無縫大眾運輸
  hook: 小朋友走大馬路上學，家長天天提心吊膽
  points:
    - 中山、新港、鹿和、彰美路商圈及和美高中、和美國小學區廣設人行道
    - 爭取和美辦理 AI 智慧號誌示範區，解決尖峰時段市區交通壅塞
    - 伸港、和美、線西增設共享單車站點，改善大眾運輸不足情況
    - 全面更換公車智慧站牌、遮陽亭，爭取尖峰時段加密班次
    - 結合中央經驗，緊盯捷運和美線審查進度
- order: 4
  area: 宜遊
  title: 活絡觀光｜濱海休閒廊道與紡織文創新生命
  hook: 在地故事這麼多，卻沒人來看？
  points:
    - 中山路、鹿和路、彰美路輔導成立商圈促進會，縣府補助打造「彰化迪化街」
    - 彰美路及和美早市打造「和美紡織文化商圈」，串聯和美古蹟帶動觀光
    - 烏溪濱海運動觀光廊道，爭取增設綜合球場（網球・匹克球・排球・足球）、停車場、公廁
    - 推動塭仔漁港升級觀光漁港、增設自行車道串聯線西海岸景點，推廣濱海捕魚牽罟文化
    - 辦理老屋街區立面修復與故事導覽，打造兼具生活與觀光價值的文創眷村
- order: 5
  area: 宜居
  title: 全齡友愛｜健全長照、減負育兒與全齡共融
  hook: 阿公阿嬤看病要轉三班車？
  points:
    - 爭取偏鄉社區幸福專車，接送長輩前往醫院、市場、公所及運動館
    - 65 歲以上長者健保費全額補助，長青卡可購輔具
    - 爭取公托 2 歲專班、準公托差價補貼、童萌卡 3 歲提高至 6 歲、坐月子營養金
    - 推動一里一公園，活化維護現有公園，打造新德美全齡×寵物共融公園
    - 建置線上社福媒合平台，提供民間完善社福互助網
- order: 6
  area: 宜業
  title: 地方教育｜三語扎根、產學鏈結與教育平權
  hook: 別的縣市孩子都在學 AI，我們不能落後
  points:
    - 提供國高中生參訪高職、大學、在地企業，辦理職涯科系實境探索
    - 推動三語教育，國中小導入 AI 程式課程
    - 推動縣府辦理產學合作基金，補助大專生研發、進駐在地企業
    - 爭取 18～40 歲青年 AI 數位工具補助 3,000 元，落實教育平權
- order: 7
  area: 宜居
  title: 地方困境突破｜治安、環保與公安治理
  hook: 遊蕩犬、毒駕、亂排放，家門口不安心
  points:
    - 動防所專案捕捉隊＋民間動保 TNvR，加強遊蕩犬管理
    - 推動住宅囤積廢棄物自治條例，強制清理、社會關懷依法有據
    - 港口安檢聯防、重要道路 AI 車牌辨識防毒駕
    - 推動 24 小時科技環保稽查隊，水質、空氣 AI 監測，改善在地環境汙染
    - 建置全民監督公共工程 App，主要幹道推動路平專案，公共工程透明化
- order: 8
  area: 宜業
  title: 舊埕翻新與空間治理｜國土計畫與創生接軌
  hook: 想擴廠、想蓋新家，卻卡在土地劃分？
  points:
    - 國土計畫通盤檢討，保留和線伸擴廠條件與生活空間
    - 督促縣府啟動和線伸都市計畫通盤檢討與擴大
    - 爭取水五金產業園區擴大納入南佃、嘉犁、鎮平、源埤
    - 爭取加強地方創生顧問團，活化閒置公有老建物
