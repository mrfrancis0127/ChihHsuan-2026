# 議題問卷設定
# endpoint：Google Apps Script「議題問卷」部署後的網址（/exec 結尾）；留空時為預覽模式（不會存資料）
endpoint: "https://script.google.com/macros/s/AKfycbzGcvNotE5J91LHA1t7xDAHFujsh8KIhC72iL2rKUvZ3MPpKuTWcHU-MVU9mzzTpk32/exec"
# popup：進入網站時是否跳出問卷邀請（true 開啟、false 關閉）
popup: true
# 停止收件日（台灣時間），過了這天問卷頁顯示「已截止」、不再跳出邀請
close_at: "2026-11-27T23:59:59+08:00"

towns: [和美鎮, 伸港鄉, 線西鄉, 其他地區]

