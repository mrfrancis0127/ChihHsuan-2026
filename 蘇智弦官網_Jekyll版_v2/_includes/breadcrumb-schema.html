<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "首頁", "item": "{{ '/' | absolute_url }}" }{% if page.collection == "policies" %},
    { "@type": "ListItem", "position": 2, "name": "政見文件", "item": "{{ '/documents/' | absolute_url }}" },
    { "@type": "ListItem", "position": 3, "name": {{ page.short_title | default: page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% else %},
    { "@type": "ListItem", "position": 2, "name": {{ page.title | jsonify }}, "item": "{{ page.url | absolute_url }}" }{% endif %}
  ]
}
</script>
